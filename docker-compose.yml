services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guard}
      POSTGRES_DB: ${POSTGRES_DB:-contract_guard}
    # Exposed so the app can also run locally against "localhost:5432".
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guard} -d ${POSTGRES_DB:-contract_guard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      # Host is "db" here, even though local runs use "localhost".
      DATABASE_URL: postgres://${POSTGRES_USER:-guard}:${POSTGRES_PASSWORD:-guard}@db:5432/${POSTGRES_DB:-contract_guard}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-.env}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:9099/webhook}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # TODO: add the starter-kit's webhook receiver once ./starter-kit is present
  # (follow its README for the service definition and port). Until then
  # WEBHOOK_URL points at a placeholder and webhook alerts are not delivered.

volumes:
  pgdata:
